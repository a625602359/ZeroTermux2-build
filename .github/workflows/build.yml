name: Build ZeroTermux2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  PKG: com.termux2
  APPNAME: ZeroTermux2
  ARCHS: aarch64
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip jq python3 python3-pip \
            ca-certificates perl sed findutils

      - name: Prepare Android SDK for APK build
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "PATH=$PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager 不存在，尝试查找..."
            find "$ANDROID_HOME" -name sdkmanager -type f || true
            exit 127
          fi

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;30.0.3" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Clone termux-packages
        run: |
          rm -rf termux-packages
          git clone --depth=1 https://github.com/termux/termux-packages.git

      - name: Patch termux-packages package name
        run: |
          cd termux-packages

          python3 - <<'PY'
          from pathlib import Path
          import re

          pkg = "com.termux2"
          p = Path("scripts/properties.sh")
          s = p.read_text()

          s2 = re.sub(
              r'TERMUX_APP__PACKAGE_NAME="[^"]+"',
              f'TERMUX_APP__PACKAGE_NAME="{pkg}"',
              s
          )

          if s2 == s:
              s2 += f'\nTERMUX_APP__PACKAGE_NAME="{pkg}"\n'

          p.write_text(s2)
          print("termux-packages 包名已修改为", pkg)
          PY

          grep -n "TERMUX_APP__PACKAGE_NAME" scripts/properties.sh || true

      - name: Build custom bootstrap
        run: |
          cd termux-packages

          docker pull ghcr.io/termux/package-builder:latest

          chmod -R 777 .

          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures "$ARCHS"

          ls -lh bootstrap-*.zip

      - name: Clone ZeroTermux source
        run: |
          rm -rf ZeroTermux
          git clone --depth=1 https://github.com/hanxinhao000/ZeroTermux.git

      - name: Patch ZeroTermux package name
        run: |
          cd ZeroTermux

          python3 - <<'PY'
          from pathlib import Path
          import re

          pkg = "com.termux2"
          appname = "ZeroTermux2"
          pkg_under = pkg.replace(".", "_")

          skip_ext = {
              ".png", ".jpg", ".jpeg", ".webp", ".gif", ".ico",
              ".zip", ".apk", ".aar", ".jar", ".jks", ".keystore",
              ".so", ".bin", ".mp4", ".mp3", ".ttf", ".otf"
          }

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue
              if ".git" in p.parts:
                  continue
              if p.suffix.lower() in skip_ext:
                  continue

              try:
                  s = p.read_text(errors="ignore")
              except Exception:
                  continue

              old = s
              s = s.replace("com.termux", pkg)
              s = s.replace("com_termux", pkg_under)

              if s != old:
                  p.write_text(s)

          # 修改 app 名称，避免把 Java/Kotlin 类名里的 Termux 乱替换
          for file in [
              "app/src/main/res/values/strings.xml",
              "app/src/main/res/values-zh/strings.xml",
              "app/src/main/res/values-zh-rCN/strings.xml",
          ]:
              p = Path(file)
              if p.exists():
                  s = p.read_text(errors="ignore")
                  s = re.sub(
                      r'(<string name="app_name">).*?(</string>)',
                      rf'\1{appname}\2',
                      s
                  )
                  p.write_text(s)

          # 修 app/build.gradle
          bg = Path("app/build.gradle")
          if bg.exists():
              s = bg.read_text()

              if "applicationId" in s:
                  s = re.sub(
                      r'applicationId\s+["\'][^"\']+["\']',
                      f'applicationId "{pkg}"',
                      s
                  )
              else:
                  s = s.replace(
                      "defaultConfig {",
                      f'defaultConfig {{ applicationId "{pkg}" ',
                      1
                  )

              if "namespace" in s:
                  s = re.sub(
                      r'namespace\s+["\'][^"\']+["\']',
                      f'namespace "{pkg}"',
                      s
                  )

              # 尽量修 manifestPlaceholders
              s = s.replace('TERMUX_PACKAGE_NAME = "com.termux"', f'TERMUX_PACKAGE_NAME = "{pkg}"')
              s = s.replace('TERMUX_APP_PACKAGE_NAME = "com.termux"', f'TERMUX_APP_PACKAGE_NAME = "{pkg}"')
              s = s.replace('TERMUX_APP_NAME = "Termux"', f'TERMUX_APP_NAME = "{appname}"')
              s = s.replace('manifestPlaceholders.TERMUX_APP_NAME = "Termux"', f'manifestPlaceholders.TERMUX_APP_NAME = "{appname}"')

              # 禁用官方 bootstrap 下载，使用我们自己的 bootstrap
              start = s.find("task downloadBootstraps()")
              end = s.find("afterEvaluate {", start)
              if start != -1 and end != -1:
                  s = (
                      s[:start]
                      + 'task downloadBootstraps() { doLast { logger.quiet("Using local custom bootstrap zips") } }\\n\\n'
                      + s[end:]
                  )

              bg.write_text(s)

          print("ZeroTermux 已修改为：", pkg, appname)
          PY

      - name: Put custom bootstrap into ZeroTermux
        run: |
          cd ZeroTermux

          mkdir -p app/src/main/cpp
          rm -f app/src/main/cpp/bootstrap-*.zip

          cp -av ../termux-packages/bootstrap-*.zip app/src/main/cpp/

          ls -lh app/src/main/cpp/bootstrap-*.zip

      - name: Build APK
        run: |
          cd ZeroTermux

          chmod +x ./gradlew || true

          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output

          find ZeroTermux/app/build/outputs/apk -type f -name "*.apk" -exec cp -av {} output/ \;

          echo "APK files:"
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTermux2-com.termux2-apk
          path: output/*.apk
