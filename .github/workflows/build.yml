name: Build ZeroTermux2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  PKG: com.termux2
  APPNAME: ZeroTermux2
  ARCHS: aarch64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip jq python3 python3-pip \
            ca-certificates perl sed findutils

      - name: Prepare Android SDK on GitHub host
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found, installing commandline tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -L -o commandlinetools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;30.0.3" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Clone termux-packages
        run: |
          rm -rf termux-packages
          git clone --depth=1 https://github.com/termux/termux-packages.git

      - name: Patch termux-packages package name
        run: |
          cd termux-packages

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          pkg = os.environ.get("PKG", "com.termux2")

          p = Path("scripts/properties.sh")
          s = p.read_text()

          s2 = re.sub(
              r'TERMUX_APP__PACKAGE_NAME="[^"]+"',
              f'TERMUX_APP__PACKAGE_NAME="{pkg}"',
              s
          )

          if s2 == s:
              s2 += f'\nTERMUX_APP__PACKAGE_NAME="{pkg}"\n'

          p.write_text(s2)

          print("termux-packages package name patched to:", pkg)
          PY

          grep -n "TERMUX_APP__PACKAGE_NAME" scripts/properties.sh || true

      - name: Build fixed Termux package-builder image
        run: |
          cat > Dockerfile.package-builder-fixed <<'EOF'
          FROM ghcr.io/termux/package-builder:latest
          USER root

          RUN set -eux; \
              SDK="$(find /home/builder/lib -maxdepth 1 -type d -name 'android-sdk-*' | head -n 1)"; \
              echo "SDK=$SDK"; \
              SDKMANAGER="$(find "$SDK" -type f -name sdkmanager | head -n 1)"; \
              echo "SDKMANAGER=$SDKMANAGER"; \
              yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true; \
              "$SDKMANAGER" --sdk_root="$SDK" \
                "platforms;android-33" \
                "build-tools;30.0.3"; \
              chown -R builder:builder /home/builder/lib /home/builder/.android || true; \
              chmod -R 777 /home/builder/lib /home/builder/.android || true

          USER builder
          EOF

          docker build -t termux-package-builder-fixed:latest -f Dockerfile.package-builder-fixed .

      - name: Build custom bootstrap
        run: |
          cd termux-packages

          chmod -R 777 .

          TERMUX_BUILDER_IMAGE_NAME=termux-package-builder-fixed \
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures "$ARCHS"

          echo "Bootstrap files:"
          ls -lh bootstrap-*.zip

      - name: Clone ZeroTermux source
        run: |
          rm -rf ZeroTermux
          git clone --depth=1 https://github.com/hanxinhao000/ZeroTermux.git

      - name: Patch ZeroTermux package name
        run: |
          cd ZeroTermux

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          pkg = os.environ.get("PKG", "com.termux2")
          appname = os.environ.get("APPNAME", "ZeroTermux2")
          pkg_under = pkg.replace(".", "_")

          skip_ext = {
              ".png", ".jpg", ".jpeg", ".webp", ".gif", ".ico",
              ".zip", ".apk", ".aar", ".jar", ".jks", ".keystore",
              ".so", ".bin", ".mp4", ".mp3", ".ttf", ".otf"
          }

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue
              if ".git" in p.parts:
                  continue
              if p.suffix.lower() in skip_ext:
                  continue

              try:
                  s = p.read_text(errors="ignore")
              except Exception:
                  continue

              old = s
              s = s.replace("com.termux", pkg)
              s = s.replace("com_termux", pkg_under)

              if s != old:
                  p.write_text(s)

          for p in Path(".").rglob("strings.xml"):
              try:
                  s = p.read_text(errors="ignore")
              except Exception:
                  continue

              old = s
              s = re.sub(
                  r'(<string\s+name="app_name"\s*>).*?(</string>)',
                  rf'\1{appname}\2',
                  s
              )
              s = re.sub(
                  r'(<string\s+name="application_name"\s*>).*?(</string>)',
                  rf'\1{appname}\2',
                  s
              )

              if s != old:
                  p.write_text(s)

          bg = Path("app/build.gradle")
          if bg.exists():
              s = bg.read_text()

              if "applicationId" in s:
                  s = re.sub(
                      r'applicationId\s+["\'][^"\']+["\']',
                      f'applicationId "{pkg}"',
                      s
                  )
              else:
                  s = s.replace(
                      "defaultConfig {",
                      f'defaultConfig {{ applicationId "{pkg}" ',
                      1
                  )

              if "namespace" in s:
                  s = re.sub(
                      r'namespace\s+["\'][^"\']+["\']',
                      f'namespace "{pkg}"',
                      s
                  )

              start = s.find("task downloadBootstraps()")
              end = s.find("afterEvaluate {", start)

              if start != -1 and end != -1:
                  s = (
                      s[:start]
                      + 'task downloadBootstraps() { doLast { logger.quiet("Using local custom bootstrap zips") } }\n\n'
                      + s[end:]
                  )

              bg.write_text(s)

          print("ZeroTermux patched to:", pkg, appname)
          PY

          grep -R "applicationId" -n app/build.gradle || true
          grep -R "namespace" -n app/build.gradle || true

      - name: Put custom bootstrap into ZeroTermux
        run: |
          cd ZeroTermux

          mkdir -p app/src/main/cpp
          rm -f app/src/main/cpp/bootstrap-*.zip

          cp -av ../termux-packages/bootstrap-*.zip app/src/main/cpp/

          ls -lh app/src/main/cpp/bootstrap-*.zip

      - name: Build APK
        run: |
          cd ZeroTermux

          chmod +x ./gradlew || true

          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output

          find ZeroTermux/app/build/outputs/apk -type f -name "*.apk" -exec cp -av {} output/ \;

          echo "APK files:"
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTermux2-com.termux2-apk
          path: output/*.apk
